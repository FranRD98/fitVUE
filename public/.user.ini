; Sube el límite de subida de archivos (por defecto muchos hostings compartidos,
; incluido Plesk, lo dejan en 2M/8M, lo que hace fallar la subida de fotos de
; perfil/ejercicios/etc. con un 422 "genérico" antes de que Laravel llegue a
; validar el archivo). PHP-FPM relee este archivo periódicamente sin reiniciar.
upload_max_filesize = 10M
post_max_size = 12M
